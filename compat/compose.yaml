# Throwaway credentials, loopback ports only. Started by compat/run.sh.
name: zodav-compat

services:
  zodav:
    build: ../webdav
    ports: ["127.0.0.1:18180:8080"]
    environment:
      ZODAV_USERNAME: compat
      ZODAV_PASSWORD: compat-password-0123456789abcdef
    tmpfs: ["/run/zodav:uid=33,gid=33,mode=0700"]
    volumes: ["zodav-data:/data"]

  rclone:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    command: ["serve", "webdav", "/data", "--addr", ":8080", "--user", "compat", "--pass", "compat-password-0123456789abcdef"]
    ports: ["127.0.0.1:18181:8080"]
    tmpfs: ["/data"]

  hacdias:
    image: ghcr.io/hacdias/webdav:v5.17.1@sha256:c8d8c436816e51e5773525f901d829afe748d3516995a31a80de1f67fb0a02ca
    command: ["-c", "/config.yml"]
    ports: ["127.0.0.1:18182:6060"]
    volumes: ["./hacdias.yml:/config.yml:ro"]
    tmpfs: ["/data"]

  nginx:
    image: nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    ports: ["127.0.0.1:18183:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.htpasswd:/etc/nginx/htpasswd:ro
    tmpfs: ["/data:uid=101,gid=101"]

  nextcloud:
    image: nextcloud:35.0.2-apache@sha256:a588aa5353703b44106a6129adaaf7bf22521b7a4754f9f529b3228d6aa390c5
    ports: ["127.0.0.1:18184:80"]
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: compat
      NEXTCLOUD_ADMIN_PASSWORD: compat-password-0123456789abcdef
      NEXTCLOUD_TRUSTED_DOMAINS: 127.0.0.1

volumes:
  zodav-data:
