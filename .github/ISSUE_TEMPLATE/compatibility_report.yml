name: Compatibility report
description: Report how a WebDAV server or provider behaves with zodav-audit
labels: [compatibility]
body:
  - type: input
    id: server
    attributes:
      label: Server name and version
      placeholder: Nextcloud 31, nginx 1.27, rclone 1.68, ...
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider or hosting
      description: Self-hosted, or the service name (Koofr, pCloud, Synology, ...).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `zodav-audit conformance --json --read-only`
      description: Remove URLs, usernames, passwords and tokens before pasting.
      render: json
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - All checks passed and Zotero syncs files
        - Some checks failed, Zotero still works
        - Zotero fails to sync files
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Settings or workarounds that mattered.
