ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 8080

ServerTokens Prod
ServerSignature Off
TraceEnable Off

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so

# The container runs as www-data already, so there is no User/Group here and
# every runtime file lives on the one tmpfs.
PidFile /run/zodav/httpd.pid
DefaultRuntimeDir /run/zodav
DavLockDB /run/zodav/DavLock

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%a %u %t \"%m %U\" %>s %B %D" zodav
CustomLog /proc/self/fd/1 zodav

RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=500
LimitRequestBody 1073741824

DocumentRoot "/srv/public"

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory "/srv/public">
    Options None
    AllowOverride None
</Directory>

<Directory "/data/zotero">
    Options None
    AllowOverride None
</Directory>

Alias "/healthz" "/srv/public/healthz"
<Location "/healthz">
    ForceType text/plain
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    <Limit GET HEAD>
        Require all granted
    </Limit>
</Location>

Alias "/zotero/" "/data/zotero/"
<Location "/zotero/">
    Dav On
    DavDepthInfinity Off

    AuthType Basic
    AuthName "ZoDAV"
    AuthBasicProvider file
    AuthUserFile /run/zodav/htpasswd

    <LimitExcept OPTIONS PROPFIND GET HEAD PUT DELETE MKCOL>
        Require all denied
    </LimitExcept>
    <Limit OPTIONS PROPFIND GET HEAD PUT DELETE MKCOL>
        Require valid-user
    </Limit>

    # The collection itself must never be deleted or overwritten. An <If> is
    # used because a second <Location> section would replace the Require rules
    # above instead of adding to them. MKCOL stays with mod_dav, which answers
    # 405 because the collection already exists.
    <If "%{REQUEST_URI} =~ m#^/zotero/?$# && %{REQUEST_METHOD} =~ /^(DELETE|PUT)$/">
        Require all denied
    </If>
</Location>
